name: CI

on:
  push:
    branches:
      - '*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: pnpm/action-setup@v4
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '22'
        cache: 'pnpm'
    - name: Install dependencies
      run: pnpm install

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure recent npm version
        run: npm install -g npm@latest
      - name: Detect prerelease tag
        id: prerelease
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "TAG_NAME=$TAG_NAME"
          if [[ "$TAG_NAME" == *"-"* ]]; then
            echo "PRERELEASE_TAG=beta" >> $GITHUB_ENV
          else
            echo "PRERELEASE_TAG=latest" >> $GITHUB_ENV
          fi
      - name: Publish
        run: npm publish --access public --tag $PRERELEASE_TAG
